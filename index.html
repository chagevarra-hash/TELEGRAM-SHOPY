<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover нужен, чтобы учитывать "чёлку" и нижнюю полосу на iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Магазин</title>

  <!-- 1. Официальный SDK Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- 2. Tailwind CSS через CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Подключаем цвета Telegram к Tailwind: классы вида bg-tg-bg, text-tg-hint, bg-tg-btn и т.д.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tg: {
              bg: "var(--bg)",
              text: "var(--text)",
              hint: "var(--hint)",
              btn: "var(--btn)",
              "btn-text": "var(--btn-text)",
              card: "var(--card)",
              danger: "var(--danger)",
            },
          },
        },
      },
    };
  </script>

  <style>
    /* ---------- Тема ----------
       Telegram сам задаёт переменные --tg-theme-* и обновляет их при смене светлой/тёмной темы.
       Второе значение в var(...) — запасной цвет, он нужен только при открытии файла в обычном браузере. */
    :root {
      --bg:       var(--tg-theme-bg-color, #ffffff);
      --text:     var(--tg-theme-text-color, #111111);
      --hint:     var(--tg-theme-hint-color, #8a8a8e);
      --btn:      var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --card:     var(--tg-theme-secondary-bg-color, #f2f2f7);
      --danger:   var(--tg-theme-destructive-text-color, #e5484d);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:   var(--tg-theme-bg-color, #17212b);
        --text: var(--tg-theme-text-color, #f5f5f5);
        --hint: var(--tg-theme-hint-color, #7d8b99);
        --card: var(--tg-theme-secondary-bg-color, #232e3c);
      }
    }

    html, body { background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    .hairline { border-color: rgba(128, 128, 128, 0.2); }

    /* Отступ снизу с учётом системной полосы iPhone */
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }

    /* Высота окна корзины: dvh корректно работает на мобильных браузерах */
    .sheet-max { max-height: 85vh; max-height: 85dvh; }

    /* Поля формы доставки */
    .field { border: 1px solid transparent; outline: none; color: inherit; resize: none; font: inherit; }
    .field::placeholder { color: var(--hint); }
    .field:focus { border-color: var(--btn); }
    .field.invalid { border-color: var(--danger); }

    button { -webkit-appearance: none; appearance: none; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
    button:disabled { cursor: default; }
  </style>
</head>

<body class="bg-tg-bg text-tg-text antialiased">

  <!-- ===== Шапка ===== -->
  <header class="px-4 pt-5 pb-3">
    <h1 id="storeName" class="text-2xl font-bold tracking-tight"></h1>
    <p id="storeTagline" class="mt-0.5 text-sm text-tg-hint"></p>
  </header>

  <!-- ===== Категории (липкие вкладки) ===== -->
  <nav class="sticky top-0 z-20 border-b bg-tg-bg hairline" aria-label="Категории">
    <div id="tabs" class="no-scrollbar flex gap-2 overflow-x-auto px-4 py-3"></div>
  </nav>

  <!-- ===== Каталог ===== -->
  <main class="px-4 pt-4 pb-32">
    <div id="grid" class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4"></div>
  </main>

  <!-- ===== Нижняя панель корзины (появляется, когда в корзине есть товары) ===== -->
  <div id="cartBar" class="safe-bottom fixed inset-x-0 bottom-0 z-30 translate-y-full px-4 pt-2 transition-transform duration-300">
    <button id="openCart" class="flex w-full items-center justify-between rounded-2xl bg-tg-btn px-4 py-3.5 text-tg-btn-text shadow-lg active:scale-[0.99]">
      <span class="flex items-center gap-2 font-medium">
        <span aria-hidden="true">🛒</span>
        <span id="barCount"></span>
      </span>
      <span class="flex items-center gap-2 font-semibold">
        <span id="barTotal"></span>
        <span aria-hidden="true">›</span>
      </span>
    </button>
  </div>

  <!-- ===== Корзина: выезжающее снизу окно ===== -->
  <div id="sheetRoot" class="pointer-events-none fixed inset-0 z-40" aria-hidden="true">
    <div id="backdrop" class="absolute inset-0 bg-black/50 opacity-0 transition-opacity duration-300"></div>

    <section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"
      class="sheet-max safe-bottom absolute inset-x-0 bottom-0 flex translate-y-full flex-col rounded-t-3xl bg-tg-bg shadow-2xl transition-transform duration-300">

      <!-- "ручка" окна -->
      <div class="flex justify-center pt-2">
        <span class="h-1 w-10 rounded-full" style="background: rgba(128,128,128,0.4)"></span>
      </div>

      <div class="flex items-center justify-between px-5 pt-3 pb-2">
        <h2 id="sheetTitle" class="text-lg font-semibold">Корзина</h2>
        <button id="closeCart" aria-label="Закрыть" class="h-9 w-9 rounded-full bg-tg-card text-base">✕</button>
      </div>

      <!-- Прокручиваемая часть окна: товары + данные для доставки -->
      <div id="sheetBody" class="flex-1 overflow-y-auto px-5 py-2">
        <div id="cartItems" class="space-y-3"></div>

        <!-- Данные для доставки (скрыты, пока корзина пуста) -->
        <div id="orderForm" class="mt-5 space-y-3">
          <h3 class="text-base font-semibold">Данные для доставки</h3>

          <div>
            <label for="fName" class="mb-1 block text-xs text-tg-hint">Имя *</label>
            <input id="fName" type="text" maxlength="60" autocomplete="name" placeholder="Как к вам обращаться"
              class="field w-full rounded-xl bg-tg-card px-3 py-3 text-base" />
            <p id="eName" class="mt-1 hidden text-xs text-tg-danger"></p>
          </div>

          <div>
            <label for="fPhone" class="mb-1 block text-xs text-tg-hint">Телефон *</label>
            <input id="fPhone" type="tel" inputmode="tel" maxlength="25" autocomplete="tel" placeholder="Номер с кодом страны"
              class="field w-full rounded-xl bg-tg-card px-3 py-3 text-base" />
            <p id="ePhone" class="mt-1 hidden text-xs text-tg-danger"></p>
          </div>

          <div>
            <label for="fAddress" class="mb-1 block text-xs text-tg-hint">Адрес доставки *</label>
            <textarea id="fAddress" rows="2" maxlength="200" autocomplete="street-address" placeholder="Город, улица, дом, квартира"
              class="field w-full rounded-xl bg-tg-card px-3 py-3 text-base"></textarea>
            <p id="eAddress" class="mt-1 hidden text-xs text-tg-danger"></p>
          </div>

          <div>
            <label for="fComment" class="mb-1 block text-xs text-tg-hint">Комментарий к заказу</label>
            <textarea id="fComment" rows="2" maxlength="300" placeholder="Необязательно"
              class="field w-full rounded-xl bg-tg-card px-3 py-3 text-base"></textarea>
          </div>
        </div>
      </div>

      <div class="hairline border-t px-5 pt-3">
        <div class="mb-3 flex items-baseline justify-between">
          <span class="text-tg-hint">Итого</span>
          <span id="sheetTotal" class="text-xl font-bold"></span>
        </div>
        <button id="checkoutBtn" class="w-full rounded-2xl bg-tg-btn py-3.5 text-base font-semibold text-tg-btn-text transition active:scale-[0.99] disabled:opacity-50">
          Оформить заказ
        </button>
      </div>
    </section>
  </div>

  <!-- Короткое уведомление -->
  <div id="toast" class="pointer-events-none fixed left-1/2 top-4 z-50 -translate-x-1/2 -translate-y-24 rounded-xl bg-tg-text px-4 py-2 text-sm text-tg-bg shadow-lg transition-transform duration-300"></div>

  <script>
    (() => {
      "use strict";

      /* =====================================================
       *  НАСТРОЙКИ МАГАЗИНА — меняйте здесь
       * ===================================================== */
      const CONFIG = {
        storeName: "Telegram Shopy",
        tagline: "Одежда и аксессуары",
        locale: "UA",
        currency: "UAH",          // код валюты: RUB, UAH, KZT, USD, EUR ...
        allLabel: "Все",          // название вкладки "все товары"
        maxQty: 99,               // максимум штук одного товара
        storageKey: "shop_cart_v1",
        catalogKey: "shop_catalog_v1",
        // Ссылка на опубликованную Google Таблицу (формат CSV) с вашими товарами.
        // Пока она пустая, показываются демо-товары из DEMO_PRODUCTS ниже.
        sheetUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSK6mBAzn06X7M5admstIKdbx4LihXgxN5dSIl1PyD-LxoHeFrMExCyhcHz_iObV-ycQ7qaxNytn5av/pub?gid=0&single=true&output=csv",
        loadTimeoutMs: 8000,      // сколько ждать загрузку каталога (мс)
      };

      /* =====================================================
       *  ДЕМО-ТОВАРЫ — показываются, пока не указана sheetUrl
       *  Настоящие товары ведутся в Google Таблице (колонки: id, title, price, category, emoji, image, active).
       * ===================================================== */
      const DEMO_PRODUCTS = [
        { id: 1, title: "Платье «Лаванда»",     price: 6900, category: "Одежда",     emoji: "👗", image: "" },
        { id: 2, title: "Туника льняная",       price: 3400, category: "Одежда",     emoji: "👚", image: "" },
        { id: 3, title: "Худи оверсайз",        price: 4200, category: "Одежда",     emoji: "🧥", image: "" },
        { id: 4, title: "Рубашка классическая", price: 3900, category: "Одежда",     emoji: "👔", image: "" },
        { id: 5, title: "Брюки прямого кроя",   price: 4500, category: "Одежда",     emoji: "👖", image: "" },
        { id: 6, title: "Шарф шёлковый",        price: 1900, category: "Аксессуары", emoji: "🧣", image: "" },
        { id: 7, title: "Сумка кросс-боди",     price: 5200, category: "Аксессуары", emoji: "👜", image: "" },
        { id: 8, title: "Кепка хлопковая",      price: 1500, category: "Аксессуары", emoji: "🧢", image: "" },
      ].map((p) => ({ ...p, hue: (p.id * 47) % 360 }));

      /* =====================================================
       *  Инициализация Telegram WebApp
       * ===================================================== */
      const tg = window.Telegram && window.Telegram.WebApp;
      // Вне Telegram (обычный браузер) платформа равна "unknown".
      // Нельзя проверять initData: при запуске с кнопки клавиатуры Telegram её не передаёт.
      const IN_TELEGRAM = Boolean(tg && tg.platform && tg.platform !== "unknown");

      if (tg) {
        tg.ready();    // сообщаем Telegram, что приложение загружено
        tg.expand();   // раскрываем на всю высоту
        try { tg.setHeaderColor("bg_color"); } catch (_) {}
        // Не даём случайно закрыть приложение свайпом вниз (доступно в новых версиях Telegram)
        try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (_) {}
      }

      /* =====================================================
       *  Состояние
       * ===================================================== */
      let activeCategory = CONFIG.allLabel;
      let sheetOpen = false;
      let PRODUCTS = [];     // список товаров, заполняется после загрузки каталога
      let categories = [CONFIG.allLabel];
      let cart = {};         // { [id товара]: количество }

      const money = (value) =>
        new Intl.NumberFormat(CONFIG.locale, {
          style: "currency",
          currency: CONFIG.currency,
          minimumFractionDigits: 0,
          maximumFractionDigits: 2,
        }).format(value);

      const $ = (id) => document.getElementById(id);
      const els = {
        tabs: $("tabs"), grid: $("grid"),
        bar: $("cartBar"), barCount: $("barCount"), barTotal: $("barTotal"), openCart: $("openCart"),
        sheetRoot: $("sheetRoot"), backdrop: $("backdrop"), sheet: $("sheet"),
        closeCart: $("closeCart"), cartItems: $("cartItems"),
        sheetBody: $("sheetBody"), orderForm: $("orderForm"),
        sheetTotal: $("sheetTotal"), checkoutBtn: $("checkoutBtn"),
        toast: $("toast"),
      };

      /* =====================================================
       *  Вспомогательные функции
       * ===================================================== */
      function esc(value) {
        return String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      // Склонение слова "товар": 1 товар, 2 товара, 5 товаров
      function itemsLabel(n) {
        const m10 = n % 10, m100 = n % 100;
        let word = "товаров";
        if (m10 === 1 && m100 !== 11) word = "товар";
        else if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) word = "товара";
        return `${n} ${word}`;
      }

      // Заглушка вместо фото: градиент + эмодзи (картинка в формате SVG, без внешних файлов)
      function placeholder(p) {
        const svg =
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">` +
          `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">` +
          `<stop offset="0" stop-color="hsl(${p.hue} 70% 88%)"/>` +
          `<stop offset="1" stop-color="hsl(${(p.hue + 40) % 360} 65% 76%)"/>` +
          `</linearGradient></defs>` +
          `<rect width="400" height="400" fill="url(#g)"/>` +
          `<text x="200" y="245" font-size="150" text-anchor="middle">${esc(p.emoji)}</text></svg>`;
        return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
      }

      function imgHTML(p, className) {
        const fallback = placeholder(p);
        return `<img src="${esc(p.image || fallback)}" data-fallback="${fallback}" alt="${esc(p.title)}" loading="lazy"
                  class="${className}" onerror="this.onerror=null;this.src=this.dataset.fallback" />`;
      }

      function haptic() {
        try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); } catch (_) {}
      }

      let toastTimer;
      function showToast(text) {
        els.toast.textContent = text;
        els.toast.classList.remove("-translate-y-24");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => els.toast.classList.add("-translate-y-24"), 2200);
      }

      /* =====================================================
       *  Каталог из Google Таблицы
       * ===================================================== */

      // Разбор CSV: понимает кавычки, запятые и переносы строк внутри ячеек
      function parseCSV(text) {
        const rows = [];
        let row = [], cell = "", inQuotes = false;
        text = text.replace(/^\uFEFF/, "");
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          if (inQuotes) {
            if (ch === '"') {
              if (text[i + 1] === '"') { cell += '"'; i++; } else { inQuotes = false; }
            } else {
              cell += ch;
            }
          } else if (ch === '"') {
            inQuotes = true;
          } else if (ch === ",") {
            row.push(cell); cell = "";
          } else if (ch === "\n" || ch === "\r") {
            if (ch === "\r" && text[i + 1] === "\n") i++;
            row.push(cell); rows.push(row); row = []; cell = "";
          } else {
            cell += ch;
          }
        }
        if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
        return rows;
      }

      // "6 900", "6900,50", "6900 грн" -> число
      function parsePrice(value) {
        return parseFloat(String(value).replace(/[\s\u00a0]/g, "").replace(",", ".").replace(/[^\d.]/g, ""));
      }

      // Ссылка на фото: только https:// или путь вида images/photo.jpg
      function safeImage(url) {
        return /^https:\/\//i.test(url) || /^[\w./%-]+$/.test(url) ? url : "";
      }

      // Превращает строки таблицы в список товаров. Некорректные строки пропускаются.
      function rowsToProducts(rows) {
        if (rows.length < 2) return [];
        const header = rows[0].map((h) => h.trim().toLowerCase());
        const col = (name) => header.indexOf(name);
        const idx = {
          id: col("id"), title: col("title"), price: col("price"), category: col("category"),
          emoji: col("emoji"), image: col("image"), active: col("active"),
        };
        if (idx.id < 0 || idx.title < 0 || idx.price < 0) {
          throw new Error("В таблице должны быть колонки id, title и price");
        }

        const seen = new Set();
        const products = [];
        for (const r of rows.slice(1)) {
          const get = (i) => (i >= 0 && r[i] !== undefined ? r[i].trim() : "");
          const id = parseInt(get(idx.id), 10);
          const title = get(idx.title);
          const price = parsePrice(get(idx.price));
          const hidden = /^(no|нет|0|false|скрыт)$/i.test(get(idx.active));
          if (!(id > 0) || !title || !(price >= 0) || hidden || seen.has(id)) continue;
          seen.add(id);
          products.push({
            id,
            title,
            price,
            category: get(idx.category) || "Товары",
            emoji: (get(idx.emoji) || "🛍️").slice(0, 8),
            image: safeImage(get(idx.image)),
            hue: (id * 47) % 360,
          });
        }
        return products;
      }

      async function fetchCatalog() {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), CONFIG.loadTimeoutMs);
        try {
          const sep = CONFIG.sheetUrl.includes("?") ? "&" : "?";
          const res = await fetch(CONFIG.sheetUrl + sep + "t=" + Date.now(), { signal: controller.signal, cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const products = rowsToProducts(parseCSV(await res.text()));
          if (!products.length) throw new Error("В таблице нет ни одного товара");
          return products;
        } finally {
          clearTimeout(timer);
        }
      }

      // Последний удачно загруженный каталог хранится на устройстве: если связи нет, покажем его
      function saveCatalogCache(products) {
        try { localStorage.setItem(CONFIG.catalogKey, JSON.stringify(products)); } catch (_) {}
      }

      function loadCatalogCache() {
        try {
          const products = JSON.parse(localStorage.getItem(CONFIG.catalogKey) || "null");
          return Array.isArray(products) && products.length ? products : null;
        } catch (_) {
          return null;
        }
      }

      async function loadCatalog() {
        if (!CONFIG.sheetUrl) return DEMO_PRODUCTS;
        try {
          const products = await fetchCatalog();
          saveCatalogCache(products);
          return products;
        } catch (err) {
          console.warn("Каталог не загрузился:", err);
          const cached = loadCatalogCache();
          if (cached) {
            showToast("Нет связи с каталогом, показаны сохранённые товары");
            return cached;
          }
          throw err;
        }
      }

      function showCatalogLoading() {
        els.grid.innerHTML = Array.from({ length: 4 }, () => `
          <div class="animate-pulse overflow-hidden rounded-2xl bg-tg-card">
            <div class="aspect-square w-full" style="background: rgba(128,128,128,0.15)"></div>
            <div class="space-y-2 p-3">
              <div class="h-3 w-3/4 rounded" style="background: rgba(128,128,128,0.2)"></div>
              <div class="h-4 w-1/3 rounded" style="background: rgba(128,128,128,0.2)"></div>
            </div>
          </div>`).join("");
      }

      function showCatalogError() {
        els.grid.innerHTML = `
          <div class="col-span-full py-16 text-center">
            <div class="mb-2 text-4xl">📡</div>
            <p class="mb-4 text-tg-hint">Не удалось загрузить каталог. Проверьте интернет и попробуйте ещё раз.</p>
            <button data-retry class="rounded-xl bg-tg-btn px-5 py-2.5 text-sm font-medium text-tg-btn-text">Повторить</button>
          </div>`;
      }

      /* =====================================================
       *  Корзина: хранение и подсчёт
       * ===================================================== */
      function loadCart() {
        try {
          const raw = JSON.parse(localStorage.getItem(CONFIG.storageKey) || "{}");
          const clean = {};
          for (const p of PRODUCTS) {
            const qty = Number(raw[p.id]);
            if (qty > 0) clean[p.id] = Math.min(Math.floor(qty), CONFIG.maxQty);
          }
          return clean;
        } catch (_) {
          return {};
        }
      }

      function saveCart() {
        try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(cart)); } catch (_) {}
      }

      function cartLines() {
        return PRODUCTS.filter((p) => cart[p.id] > 0).map((p) => ({ p, qty: cart[p.id] }));
      }

      function totals() {
        const sum = cartLines().reduce(
          (acc, { p, qty }) => ({ count: acc.count + qty, total: acc.total + p.price * qty }),
          { count: 0, total: 0 }
        );
        sum.total = Math.round(sum.total * 100) / 100; // округляем до копеек
        return sum;
      }

      function changeQty(id, delta) {
        const next = Math.max(0, Math.min(CONFIG.maxQty, (cart[id] || 0) + delta));
        if (next === 0) delete cart[id]; else cart[id] = next;
        saveCart();
        haptic();
        refreshCardAction(id);
        renderBar();
        renderSheet();
      }

      /* =====================================================
       *  Отрисовка: вкладки категорий
       * ===================================================== */
      function renderTabs() {
        els.tabs.innerHTML = categories.map((name) => {
          const active = name === activeCategory;
          return `<button data-cat="${esc(name)}"
                    class="shrink-0 rounded-full px-4 py-2 text-sm font-medium transition
                           ${active ? "bg-tg-btn text-tg-btn-text" : "bg-tg-card text-tg-text"}">${esc(name)}</button>`;
        }).join("");
      }

      /* =====================================================
       *  Отрисовка: каталог
       * ===================================================== */
      function actionHTML(id) {
        const qty = cart[id] || 0;
        if (!qty) {
          return `<button data-add="${id}"
                    class="w-full rounded-xl bg-tg-btn py-2.5 text-sm font-medium text-tg-btn-text transition active:scale-95">В корзину</button>`;
        }
        return `<div class="flex items-center justify-between rounded-xl bg-tg-bg px-1 py-1">
                  <button data-dec="${id}" aria-label="Убрать один" class="h-9 w-9 rounded-lg text-lg">−</button>
                  <span class="text-sm font-semibold">${qty}</span>
                  <button data-inc="${id}" aria-label="Добавить ещё" class="h-9 w-9 rounded-lg text-lg">+</button>
                </div>`;
      }

      function cardHTML(p) {
        return `<article class="flex flex-col overflow-hidden rounded-2xl bg-tg-card">
                  <div class="aspect-square w-full overflow-hidden">
                    ${imgHTML(p, "h-full w-full object-cover")}
                  </div>
                  <div class="flex flex-1 flex-col gap-1.5 p-3">
                    <h3 class="line-clamp-2 text-sm font-medium leading-snug">${esc(p.title)}</h3>
                    <p class="text-base font-semibold">${money(p.price)}</p>
                    <div class="mt-auto pt-1" id="act-${p.id}">${actionHTML(p.id)}</div>
                  </div>
                </article>`;
      }

      function renderGrid() {
        const list = activeCategory === CONFIG.allLabel
          ? PRODUCTS
          : PRODUCTS.filter((p) => p.category === activeCategory);
        els.grid.innerHTML = list.map(cardHTML).join("");
      }

      // Обновляем только кнопку на одной карточке, чтобы не перерисовывать каталог целиком
      function refreshCardAction(id) {
        const box = document.getElementById(`act-${id}`);
        if (box) box.innerHTML = actionHTML(id);
      }

      /* =====================================================
       *  Отрисовка: нижняя панель и окно корзины
       * ===================================================== */
      function renderBar() {
        const { count, total } = totals();
        els.barCount.textContent = itemsLabel(count);
        els.barTotal.textContent = money(total);
        els.bar.classList.toggle("translate-y-full", count === 0);
      }

      function renderSheet() {
        const lines = cartLines();
        const { total } = totals();

        if (!lines.length) {
          els.cartItems.innerHTML =
            `<div class="py-12 text-center text-tg-hint"><div class="mb-2 text-4xl">🛒</div>Корзина пуста</div>`;
        } else {
          els.cartItems.innerHTML = lines.map(({ p, qty }) => `
            <div class="flex items-center gap-3">
              <div class="h-16 w-16 shrink-0 overflow-hidden rounded-xl">
                ${imgHTML(p, "h-full w-full object-cover")}
              </div>
              <div class="min-w-0 flex-1">
                <p class="truncate text-sm font-medium">${esc(p.title)}</p>
                <p class="text-xs text-tg-hint">${money(p.price)} за шт.</p>
                <div class="mt-1.5 inline-flex items-center rounded-lg bg-tg-card">
                  <button data-dec="${p.id}" aria-label="Убрать один" class="h-8 w-8 text-lg">−</button>
                  <span class="min-w-[1.5rem] text-center text-sm font-semibold">${qty}</span>
                  <button data-inc="${p.id}" aria-label="Добавить ещё" class="h-8 w-8 text-lg">+</button>
                </div>
              </div>
              <div class="shrink-0 text-sm font-semibold">${money(p.price * qty)}</div>
            </div>`).join("");
        }

        els.sheetTotal.textContent = money(total);
        els.checkoutBtn.disabled = lines.length === 0;
        els.orderForm.classList.toggle("hidden", lines.length === 0);
      }

      /* =====================================================
       *  Окно корзины: открыть / закрыть
       * ===================================================== */
      function openSheet() {
        if (sheetOpen) return;
        sheetOpen = true;
        renderSheet();
        els.sheetBody.scrollTop = 0;
        els.sheetRoot.classList.remove("pointer-events-none");
        els.sheetRoot.setAttribute("aria-hidden", "false");
        els.backdrop.classList.remove("opacity-0");
        els.sheet.classList.remove("translate-y-full");
        document.body.style.overflow = "hidden";
        // Кнопка "назад" в шапке Telegram закрывает корзину
        try { if (tg && tg.BackButton) tg.BackButton.show(); } catch (_) {}
      }

      function closeSheet() {
        if (!sheetOpen) return;
        sheetOpen = false;
        els.sheetRoot.classList.add("pointer-events-none");
        els.sheetRoot.setAttribute("aria-hidden", "true");
        els.backdrop.classList.add("opacity-0");
        els.sheet.classList.add("translate-y-full");
        document.body.style.overflow = "";
        try { if (tg && tg.BackButton) tg.BackButton.hide(); } catch (_) {}
      }

      /* =====================================================
       *  Данные покупателя (форма доставки)
       * ===================================================== */
      const CUSTOMER_KEY = "shop_customer_v1";
      const fields = { name: $("fName"), phone: $("fPhone"), address: $("fAddress"), comment: $("fComment") };
      const errBoxes = { name: $("eName"), phone: $("ePhone"), address: $("eAddress") };

      // Запоминаем имя, телефон и адрес, чтобы постоянному клиенту не вводить их заново
      function loadCustomer() {
        try {
          const saved = JSON.parse(localStorage.getItem(CUSTOMER_KEY) || "{}");
          fields.name.value = saved.name || "";
          fields.phone.value = saved.phone || "";
          fields.address.value = saved.address || "";
        } catch (_) {}
      }

      function saveCustomer(c) {
        try {
          localStorage.setItem(CUSTOMER_KEY, JSON.stringify({ name: c.name, phone: c.phone, address: c.address }));
        } catch (_) {}
      }

      function readCustomer() {
        return {
          name: fields.name.value.trim(),
          phone: fields.phone.value.trim(),
          address: fields.address.value.trim(),
          comment: fields.comment.value.trim(),
        };
      }

      // Возвращает объект с ошибками, например { phone: "Введите номер телефона ..." }
      function validateCustomer(c) {
        const errors = {};
        if (c.name.length < 2) errors.name = "Укажите имя";
        const digits = c.phone.replace(/\D/g, "");
        if (digits.length < 10 || digits.length > 15) errors.phone = "Введите номер телефона (от 10 до 15 цифр)";
        if (c.address.length < 5) errors.address = "Укажите адрес доставки";
        return errors;
      }

      function showErrors(errors) {
        for (const key of Object.keys(errBoxes)) {
          const text = errors[key] || "";
          errBoxes[key].textContent = text;
          errBoxes[key].classList.toggle("hidden", !text);
          fields[key].classList.toggle("invalid", Boolean(text));
        }
      }

      /* =====================================================
       *  Оформление заказа -> отправка данных боту
       * ===================================================== */
      function byteLength(str) {
        return new TextEncoder().encode(str).length;
      }

      // Собираем данные заказа. Telegram принимает не более 4096 байт, поэтому при
      // большом заказе сначала сокращаем список товаров, затем убираем комментарий.
      function buildPayload(lines, total, customer) {
        const limit = 4096;
        const full = {
          items: lines.map(({ p, qty }) => ({ id: p.id, title: p.title, price: p.price, qty })),
          total,
          currency: CONFIG.currency,
          customer,
        };
        if (byteLength(JSON.stringify(full)) <= limit) return full;

        const compact = { ...full, items: lines.map(({ p, qty }) => ({ id: p.id, qty })) };
        if (byteLength(JSON.stringify(compact)) <= limit) return compact;

        compact.customer = { ...customer, comment: "" };
        return byteLength(JSON.stringify(compact)) <= limit ? compact : null;
      }

      function checkout() {
        const lines = cartLines();
        if (!lines.length) return;

        // 1. Проверяем данные покупателя
        const customer = readCustomer();
        const errors = validateCustomer(customer);
        showErrors(errors);
        const firstBad = Object.keys(errors)[0];
        if (firstBad) {
          fields[firstBad].scrollIntoView({ block: "center", behavior: "smooth" });
          fields[firstBad].focus({ preventScroll: true });
          showToast("Заполните данные для доставки");
          return;
        }
        saveCustomer(customer);

        // 2. Собираем заказ
        const { total } = totals();
        const payload = buildPayload(lines, total, customer);
        if (!payload) {
          showToast("Заказ слишком большой, уменьшите количество товаров");
          return;
        }
        const json = JSON.stringify(payload);

        if (!IN_TELEGRAM) {
          // Тестовый режим: страница открыта не из Telegram, отправлять некуда
          console.log("Заказ (тестовый режим):", json);
          alert("Тестовый режим (открыто вне Telegram).\nplatform: " + (tg ? tg.platform : "SDK не загружен") + "\nЗаказ:\n" + json);
          return;
        }

        // 3. Отправляем боту
        cart = {};
        saveCart();
        fields.comment.value = "";
        tg.sendData(json); // отправляем заказ боту (приложение при этом закроется)
        tg.close();        // на всякий случай закрываем явно
      }

      /* =====================================================
       *  Обработчики событий
       * ===================================================== */
      els.tabs.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-cat]");
        if (!btn) return;
        activeCategory = btn.dataset.cat;
        renderTabs();
        renderGrid();
        window.scrollTo({ top: 0 });
      });

      // Кнопки "В корзину", "+" и "−" работают и в каталоге, и в окне корзины
      function onQtyClick(e) {
        const btn = e.target.closest("[data-add],[data-inc],[data-dec]");
        if (!btn) return;
        if (btn.dataset.add) changeQty(Number(btn.dataset.add), 1);
        else if (btn.dataset.inc) changeQty(Number(btn.dataset.inc), 1);
        else if (btn.dataset.dec) changeQty(Number(btn.dataset.dec), -1);
      }
      els.grid.addEventListener("click", onQtyClick);
      els.grid.addEventListener("click", (e) => { if (e.target.closest("[data-retry]")) init(); });
      els.cartItems.addEventListener("click", onQtyClick);

      // Как только человек начинает исправлять поле, убираем красную ошибку
      for (const key of Object.keys(errBoxes)) {
        fields[key].addEventListener("input", () => {
          errBoxes[key].classList.add("hidden");
          fields[key].classList.remove("invalid");
        });
      }

      els.openCart.addEventListener("click", openSheet);
      els.closeCart.addEventListener("click", closeSheet);
      els.backdrop.addEventListener("click", closeSheet);
      els.checkoutBtn.addEventListener("click", checkout);
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
      try { if (tg && tg.BackButton) tg.BackButton.onClick(closeSheet); } catch (_) {}

      /* =====================================================
       *  Старт
       * ===================================================== */
      async function init() {
        els.tabs.innerHTML = "";
        showCatalogLoading();
        try {
          PRODUCTS = await loadCatalog();
        } catch (err) {
          console.error("Каталог не загружен:", err);
          showCatalogError();
          return;
        }
        categories = [CONFIG.allLabel, ...new Set(PRODUCTS.map((p) => p.category))];
        activeCategory = CONFIG.allLabel;
        cart = loadCart();
        renderTabs();
        renderGrid();
        renderBar();
        renderSheet();
      }

      document.title = CONFIG.storeName;
      $("storeName").textContent = CONFIG.storeName;
      $("storeTagline").textContent = CONFIG.tagline;
      loadCustomer();
      init();
    })();
  </script>
</body>
</html>
